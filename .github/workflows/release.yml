name: Release

env:
  NODE_VERSION: "22"
  BUN_VERSION: "1.4.0"
  CDXGEN_VERSION: "12.1.5"
  CARGO_INCREMENTAL: 0

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      publish_to_npm:
        description: Publish the current VERSION to npm after verification
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-ref:
    name: Release ref
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.publish_to_npm
      && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - run: |
          echo "::error::Manual npm publishing must run from main."
          exit 1

  preflight:
    name: Preflight
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.publish_to_npm != true
      || github.ref == 'refs/heads/main'
    uses: stella/.github/.github/workflows/npm-version-preflight.yml@48aacae31829ce15216a6b766b03a92fd2e84da3
    with:
      package-files: |
        package.json
        wasm/package.json
        npm/darwin-arm64/package.json
        npm/darwin-x64/package.json
        npm/linux-arm64-gnu/package.json
        npm/linux-x64-gnu/package.json
        npm/wasm32-wasi/package.json
        npm/win32-x64-msvc/package.json
      dependency-name-prefixes: |
        @stll/aho-corasick-
      publish-to-npm: >-
        ${{ github.event_name == 'push'
            || (inputs.publish_to_npm && github.ref == 'refs/heads/main') }}

  verify:
    name: Verify
    needs: preflight
    if: needs.preflight.outputs.already-released != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/version-sync.mjs check
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: wasm32-wasip1-threads
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: release-verify
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-targets --all-features
      - name: License audit
        run: |
          cargo install cargo-deny --locked
          cargo deny check
      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings
      - uses: stella/.github/actions/provenance-check@48aacae31829ce15216a6b766b03a92fd2e84da3
        with:
          provenance-version: v0.1.3
      - run: bun run build
      - run: bun run build:js
      - run: bun test
      - run: bun run test:props
      - run: bun run test:runtime:bun
      - run: bun run test:runtime:node

  build:
    name: Build - ${{ matrix.settings.target }}
    needs: [preflight, verify]
    if: needs.preflight.outputs.already-released != 'true'
    runs-on: ${{ matrix.settings.os }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - target: x86_64-apple-darwin
            os: macos-15
            node_artifact: aho-corasick.darwin-x64.node
          - target: aarch64-apple-darwin
            os: macos-15
            node_artifact: aho-corasick.darwin-arm64.node
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            node_artifact: aho-corasick.linux-x64-gnu.node
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: true
            node_artifact: aho-corasick.linux-arm64-gnu.node
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            node_artifact: aho-corasick.win32-x64-msvc.node
          - target: wasm32-wasip1-threads
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: release-build-${{ matrix.settings.target }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Build native
        if: >-
          !matrix.settings.use-cross
          && matrix.settings.target != 'wasm32-wasip1-threads'
        env:
          BUILD_TARGET: ${{ matrix.settings.target }}
        run: bun run build --target "$BUILD_TARGET"
      - name: Build cross-compile
        if: ${{ matrix.settings.use-cross }}
        env:
          BUILD_TARGET: ${{ matrix.settings.target }}
        run: >
          bun run build
          --target "$BUILD_TARGET"
          --use-napi-cross
      - name: Build WASM
        if: matrix.settings.target == 'wasm32-wasip1-threads'
        run: bun run build:wasm
      - name: Upload native binding
        if: matrix.settings.target != 'wasm32-wasip1-threads'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bindings-${{ matrix.settings.target }}
          path: ${{ matrix.settings.node_artifact }}
          if-no-files-found: error
      - name: Upload WASM bindings
        if: matrix.settings.target == 'wasm32-wasip1-threads'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bindings-${{ matrix.settings.target }}
          path: |
            *.wasm
            !*.debug.wasm
            *.cjs
            *.d.cts
            *.js
            *.mjs
          if-no-files-found: error

  test:
    name: Test (${{ matrix.os }})
    needs: [preflight, build]
    if: needs.preflight.outputs.already-released != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Move artifacts
        shell: bash
        run: |
          set -euo pipefail
          ls -R artifacts/
          for dir in artifacts/bindings-*; do
            cp -- "$dir"/* .
          done
          ls -la -- *.node 2>/dev/null || echo "No .node files"
          ls -la -- *.wasm 2>/dev/null || echo "No .wasm files"
      - run: bun test
      - name: Property tests
        if: matrix.os == 'ubuntu-latest'
        run: bun run test:props

  pack:
    name: Pack
    needs: [preflight, verify, test]
    if: needs.preflight.outputs.already-released != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      aux_tarballs: ${{ steps.pack.outputs.aux_tarballs }}
      root_tarball: ${{ steps.pack.outputs.root_tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Install SBOM generator
        # This fixed CLI generates release metadata without receiving publish credentials.
        # zizmor: ignore[adhoc-packages]
        run: npm install --global --ignore-scripts "@cyclonedx/cdxgen@${CDXGEN_VERSION}"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Prepare npm packages
        run: bun x @napi-rs/cli artifacts
      - name: Move artifacts
        shell: bash
        run: |
          set -euo pipefail
          ls -R artifacts/
          for dir in artifacts/bindings-*; do
            cp -- "$dir"/* .
          done
      - run: bun run build:js
      - run: node scripts/prepare-release-package.mjs
      - name: Pack release tarballs
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts

          root_json="$(npm pack --json --ignore-scripts --pack-destination release-artifacts)"
          root_file="$(echo "$root_json" | jq -r '.[0].filename')"
          root_tarball="release-artifacts/$root_file"

          while IFS= read -r pkg; do
            (
              cd "$pkg"
              npm pack --json --ignore-scripts --pack-destination "$GITHUB_WORKSPACE/release-artifacts" >/dev/null
            )
          done < <(find npm -mindepth 1 -maxdepth 1 -type d | sort)

          (
            cd wasm
            npm pack --json --ignore-scripts --pack-destination "$GITHUB_WORKSPACE/release-artifacts" >/dev/null
          )

          mapfile -t aux_tarballs < <(find release-artifacts -maxdepth 1 -name '*.tgz' ! -name "$root_file" | sort)
          node scripts/check-release-tarballs.mjs "$root_tarball" "${aux_tarballs[@]}"

          echo "root_tarball=$root_tarball" >> "$GITHUB_OUTPUT"
          {
            echo 'aux_tarballs<<EOF'
            printf '%s\n' "${aux_tarballs[@]}"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Generate release checksums
        run: |
          set -euo pipefail
          (
            cd release-artifacts
            sha256sum -- ./*.tgz > SHA256SUMS
          )
      - name: Generate attestation SBOM
        run: >
          cdxgen
          --spec-version 1.6
          --required-only
          --exclude-regex '(^|/)node_modules(/.*)?$'
          --output release-artifacts/attest-sbom.cdx.json
          .
      - name: Stage provenance release assets
        run: |
          set -euo pipefail
          cp provenance/sbom.cdx.json release-artifacts/provenance-sbom.cdx.json
          cp provenance/THIRD-PARTY-NOTICES.txt release-artifacts/provenance-THIRD-PARTY-NOTICES.txt
          cp provenance/report.json release-artifacts/provenance-report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: release-artifacts
          if-no-files-found: error

  attest:
    name: Attest npm artifacts
    needs: pack
    if: >-
      github.event_name == 'push'
      || (inputs.publish_to_npm && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      attestations: write # Required to record artifact attestations.
      contents: read
      id-token: write # Required to sign artifact attestations.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: release-artifacts
      - name: Attest root package tarball with SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ needs.pack.outputs.root_tarball }}
          sbom-path: release-artifacts/attest-sbom.cdx.json
      - name: Attest auxiliary package tarballs
        if: needs.pack.outputs.aux_tarballs != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ needs.pack.outputs.aux_tarballs }}

  core-package:
    name: Package Rust core
    needs: [preflight, verify, test]
    if: >-
      always()
      && needs.preflight.result == 'success'
      && (needs.preflight.outputs.already-released == 'true'
          || (needs.verify.result == 'success'
              && needs.test.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - run: node scripts/version-sync.mjs check
      - name: Package and verify Rust core
        run: cargo package --package stella-aho-corasick-core --locked
      - name: Build exact crates.io upload artifact
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          crate="target/package/stella-aho-corasick-core-${version}.crate"
          mkdir -p core-crate
          cp -- "$crate" core-crate/
          node scripts/create-crate-upload.mjs \
            stella-aho-corasick-core \
            "core-crate/$(basename "$crate")" \
            core-crate/upload.bin \
            core-crate/release.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-crate
          path: core-crate
          if-no-files-found: error

  core:
    name: Publish Rust core
    needs: core-package
    if: >-
      github.event_name == 'push'
      || (inputs.publish_to_npm && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write # Required only for the crates.io publishing token.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: core-crate
          path: core-crate
      - name: Validate Rust release artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          manifest=core-crate/release.json
          upload=core-crate/upload.bin
          test -f "$manifest"
          test -f "$upload"

          name="$(jq -er '.name' "$manifest")"
          version="$(jq -er '.version' "$manifest")"
          crate_file="$(jq -er '.crateFile' "$manifest")"
          upload_file="$(jq -er '.uploadFile' "$manifest")"
          [[ "$name" == "stella-aho-corasick-core" ]]
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$crate_file" == "${name}-${version}.crate" ]]
          [[ "$upload_file" == "upload.bin" ]]
          test -f "core-crate/$crate_file"

          crate_sha="$(jq -er '.crateSha256' "$manifest")"
          upload_sha="$(jq -er '.uploadSha256' "$manifest")"
          [[ "$crate_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$upload_sha" =~ ^[0-9a-f]{64}$ ]]
          echo "$crate_sha  core-crate/$crate_file" | sha256sum --check --strict
          echo "$upload_sha  $upload" | sha256sum --check --strict

          {
            echo "name=$name"
            echo "version=$version"
            echo "crate_sha256=$crate_sha"
          } >> "$GITHUB_OUTPUT"
      - name: Check exact crates.io version
        id: crate-status
        shell: bash
        env:
          CRATE_NAME: ${{ steps.artifact.outputs.name }}
          CRATE_VERSION: ${{ steps.artifact.outputs.version }}
          EXPECTED_CRATE_SHA256: ${{ steps.artifact.outputs.crate_sha256 }}
        run: |
          set -euo pipefail
          response="${RUNNER_TEMP}/crate-version.json"
          status="$(curl --proto '=https' --tlsv1.2 --retry 3 -sS \
            --user-agent 'stella-aho-corasick-release' \
            --output "$response" --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/${CRATE_NAME}/${CRATE_VERSION}")"
          case "$status" in
            200)
              jq -e --arg version "$CRATE_VERSION" \
                '.version.num == $version' "$response" >/dev/null
              archive="${RUNNER_TEMP}/existing-crate.crate"
              archive_status="$(curl --location --proto '=https' \
                --proto-redir '=https' --tlsv1.2 --retry 3 -sS \
                --user-agent 'stella-aho-corasick-release' \
                --output "$archive" --write-out '%{http_code}' \
                "https://crates.io/api/v1/crates/${CRATE_NAME}/${CRATE_VERSION}/download")"
              [[ "$archive_status" == 200 ]]
              archive_sha="$(sha256sum "$archive" | cut -d ' ' -f1)"
              if [[ "$archive_sha" != "$EXPECTED_CRATE_SHA256" ]]; then
                echo "::error::Existing crates.io archive does not match the prepared crate."
                exit 1
              fi
              echo "already-released=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "already-released=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::crates.io returned HTTP ${status}"
              cat "$response"
              exit 1
              ;;
          esac
      - name: Authenticate to crates.io
        id: crates-io-auth
        if: steps.crate-status.outputs.already-released != 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish Rust core
        if: steps.crate-status.outputs.already-released != 'true'
        env:
          CRATES_IO_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          CRATE_NAME: ${{ steps.artifact.outputs.name }}
          CRATE_VERSION: ${{ steps.artifact.outputs.version }}
          EXPECTED_CRATE_SHA256: ${{ steps.artifact.outputs.crate_sha256 }}
        run: |
          set -euo pipefail
          response="${RUNNER_TEMP}/publish-response.json"
          status="$(curl --proto '=https' --tlsv1.2 -sS \
            --request PUT \
            --header 'Accept: application/json' \
            --header "Authorization: ${CRATES_IO_TOKEN}" \
            --header 'Content-Type: application/octet-stream' \
            --data-binary @core-crate/upload.bin \
            --output "$response" \
            --write-out '%{http_code}' \
            https://crates.io/api/v1/crates/new || true)"
          if [[ "$status" == 2* ]] &&
            jq -e '(.errors // []) | length == 0' "$response" >/dev/null; then
            exit 0
          fi

          # A timed-out or failed response can still follow a committed upload.
          # Never resend the immutable version until the registry has had a
          # bounded opportunity to expose that exact release.
          published_response="${RUNNER_TEMP}/ambiguous-published-version.json"
          for attempt in {1..12}; do
            published_status="$(curl --proto '=https' --tlsv1.2 --retry 3 -sS \
              --user-agent 'stella-aho-corasick-release' \
              --output "$published_response" --write-out '%{http_code}' \
              "https://crates.io/api/v1/crates/${CRATE_NAME}/${CRATE_VERSION}" || true)"
            if [[ "$published_status" == 200 ]] &&
              jq -e --arg version "$CRATE_VERSION" \
                '.version.num == $version' "$published_response" >/dev/null; then
              archive="${RUNNER_TEMP}/ambiguous-published-crate.crate"
              archive_status="$(curl --location --proto '=https' \
                --proto-redir '=https' --tlsv1.2 --retry 3 -sS \
                --user-agent 'stella-aho-corasick-release' \
                --output "$archive" --write-out '%{http_code}' \
                "https://crates.io/api/v1/crates/${CRATE_NAME}/${CRATE_VERSION}/download" || true)"
              if [[ "$archive_status" == 200 ]]; then
                archive_sha="$(sha256sum "$archive" | cut -d ' ' -f1)"
                if [[ "$archive_sha" != "$EXPECTED_CRATE_SHA256" ]]; then
                  echo "::error::The ambiguously published crates.io archive does not match the prepared crate."
                  exit 1
                fi
                echo "::notice::The ambiguous upload committed ${CRATE_NAME} ${CRATE_VERSION}."
                exit 0
              fi
            fi
            sleep 5
          done

          if [[ -f "$response" ]]; then
            jq -r '.errors[]?.detail // empty' "$response"
          fi
          echo "::error::crates.io upload returned HTTP ${status}; the exact version is not visible after ${attempt} checks."
          exit 1
      - name: Verify exact crates.io release
        shell: bash
        env:
          CRATE_NAME: ${{ steps.artifact.outputs.name }}
          CRATE_VERSION: ${{ steps.artifact.outputs.version }}
          EXPECTED_CRATE_SHA256: ${{ steps.artifact.outputs.crate_sha256 }}
        run: |
          set -euo pipefail
          response="${RUNNER_TEMP}/published-crate-version.json"
          for attempt in {1..12}; do
            status="$(curl --proto '=https' --tlsv1.2 --retry 3 -sS \
              --user-agent 'stella-aho-corasick-release' \
              --output "$response" --write-out '%{http_code}' \
              "https://crates.io/api/v1/crates/${CRATE_NAME}/${CRATE_VERSION}" || true)"
            if [[ "$status" == 200 ]] &&
              jq -e --arg version "$CRATE_VERSION" \
                '.version.num == $version' "$response" >/dev/null; then
              archive="${RUNNER_TEMP}/published-crate.crate"
              archive_status="$(curl --location --proto '=https' \
                --proto-redir '=https' --tlsv1.2 --retry 3 -sS \
                --user-agent 'stella-aho-corasick-release' \
                --output "$archive" --write-out '%{http_code}' \
                "https://crates.io/api/v1/crates/${CRATE_NAME}/${CRATE_VERSION}/download" || true)"
              if [[ "$archive_status" == 200 ]]; then
                archive_sha="$(sha256sum "$archive" | cut -d ' ' -f1)"
                if [[ "$archive_sha" != "$EXPECTED_CRATE_SHA256" ]]; then
                  echo "::error::Published crates.io archive does not match the prepared crate."
                  exit 1
                fi
                exit 0
              fi
            fi
            if [[ "$attempt" == 12 ]]; then
              echo "::error::${CRATE_NAME} ${CRATE_VERSION} is not available"
              exit 1
            fi
            sleep 5
          done

  finalize:
    name: Finalize
    needs: [preflight, pack, attest, core]
    if: >-
      needs.preflight.outputs.already-released != 'true'
      && needs.core.result == 'success'
      && (github.event_name == 'push'
          || (inputs.publish_to_npm && github.ref == 'refs/heads/main'))
    uses: stella/.github/.github/workflows/npm-version-finalize.yml@1ce0079bbdbf93a4c1917d2857496b89aedcec14
    with:
      package-files: |
        package.json
        wasm/package.json
        npm/darwin-arm64/package.json
        npm/darwin-x64/package.json
        npm/linux-arm64-gnu/package.json
        npm/linux-x64-gnu/package.json
        npm/wasm32-wasi/package.json
        npm/win32-x64-msvc/package.json
      publish-to-npm: >-
        ${{ github.event_name == 'push'
            || (inputs.publish_to_npm && github.ref == 'refs/heads/main') }}
      update-changelog: false
    permissions:
      contents: write # Required to create the release tag and GitHub release.
      id-token: write # Required only for npm trusted publishing.
    secrets:
      CHANGELOG_APP_ID: ${{ secrets.CHANGELOG_APP_ID }}
      CHANGELOG_APP_PRIVATE_KEY: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
