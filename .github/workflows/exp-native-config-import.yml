name: exp native config import

on:
  push:
    branches: [exp/native-config-import]

permissions:
  contents: read

jobs:
  compare:
    name: compare ${{ matrix.order }} ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        order: [stub-first, full-first]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bash .github/exp/compare.sh ${{ matrix.order }}
