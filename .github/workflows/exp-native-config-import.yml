name: exp native config import

on:
  push:
    branches: [exp/native-config-import]

permissions:
  contents: read
  actions: read

jobs:
  suite:
    name: suite ${{ matrix.shard }} early-tools=${{ matrix.early }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
        early: [true, false]
    steps:
      - run: date -u +%T.%N; uptime; cat /proc/pressure/io
      - name: tools early (odd shards)
        if: matrix.early
        run: sudo apt-get install -y -q gdb strace >/dev/null 2>&1 || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          run-id: 41871493807
          github-token: ${{ github.token }}
      - name: Move artifacts
        run: |
          for dir in artifacts/bindings-*; do
            cp -- "$dir"/*.node . 2>/dev/null || true
            cp -- "$dir"/*.wasm . 2>/dev/null || true
            cp -- "$dir"/*.cjs . 2>/dev/null || true
            cp -- "$dir"/*.wasi*.d.cts . 2>/dev/null || true
            cp -- "$dir"/*.wasi-browser.js . 2>/dev/null || true
            cp -- "$dir"/wasi-worker*.mjs . 2>/dev/null || true
          done
          rm -rf artifacts
      - name: start sampler
        run: |
          nohup bash .github/exp/watch-node.sh >/dev/null 2>&1 &
          uptime; cat /proc/pressure/io
      - name: first bun test (CI conditions)
        continue-on-error: true
        run: bun test 2>&1 | grep -E "toolchain guard|native Node|tests failed|^ *[0-9]+ (pass|fail)|Ran |dangling|timed out"
      - name: tools for diagnostics
        run: sudo apt-get install -y -q gdb strace >/dev/null 2>&1 || true
      - name: repeated bun test
        continue-on-error: true
        run: |
          for i in $(seq 1 15); do
            bun test 2>&1 | grep -E "toolchain guard|native Node|dangling|timed out" | tr '\n' ' '; echo
          done
      - name: diagnostics
        if: always()
        run: cat probe-out/diag.txt 2>/dev/null || echo "no slow node process seen"
