name: Release PR

on:
  push:
    branches: [main]

concurrency:
  group: release-pr-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    permissions:
      contents: read
      pull-requests: read
      checks: read
    uses: stella/.github/.github/workflows/changeset-release-pr.yml@fc5f380b18234429cb60682ccfe1537561311e61
    secrets:
      CHANGELOG_APP_ID: ${{ secrets.CHANGELOG_APP_ID }}
      CHANGELOG_APP_PRIVATE_KEY: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
